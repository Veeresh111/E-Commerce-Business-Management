name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install backend dependencies
        working-directory: ecommerce-shop-master
        run: npm install

      - name: Run backend tests
        working-directory: ecommerce-shop-master
        run: npm test

      - name: Install frontend dependencies
        working-directory: ecommerce-shop-master/frontend
        run: npm install

      - name: Lint frontend
        working-directory: ecommerce-shop-master/frontend
        run: npm run lint

      - name: Build frontend
        working-directory: ecommerce-shop-master/frontend
        run: npm run build